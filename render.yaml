services:
  - type: web
    name: amigos-run
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: amigos-run-db
          property: connectionString

databases:
  - name: amigos-run-db
    plan: free
